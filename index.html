<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serenity Watch — @aleabitoreddit 追蹤儀表板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC",sans-serif;
         background:#0f1923; color:#e0e0e0; padding:16px; max-width:1100px; margin:0 auto; }
  h1 { color:#4fc3f7; font-size:22px; }
  .subtitle { color:#90a4ae; margin:4px 0 16px; font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .stat-card { background:#1a2733; border-radius:8px; padding:14px; text-align:center; }
  .stat-card .num { font-size:26px; font-weight:bold; color:#4fc3f7; }
  .stat-card .num.bullish{color:#4caf50;} .stat-card .num.bearish{color:#f44336;} .stat-card .num.neutral{color:#90a4ae;}
  .stat-card .label { font-size:12px; color:#90a4ae; margin-top:4px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:#1a2733; color:#e0e0e0; border:1px solid #2a3a4a; padding:8px 18px;
                 border-radius:20px; cursor:pointer; font-size:14px; }
  .tabs button.active { background:#4fc3f7; color:#0f1923; border-color:#4fc3f7; font-weight:bold; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .toolbar button { background:#1a2733; color:#e0e0e0; border:1px solid #2a3a4a; padding:5px 14px;
                    border-radius:16px; cursor:pointer; font-size:12px; }
  .toolbar button.active { background:#37474f; border-color:#4fc3f7; color:#4fc3f7; }
  .search-box { background:#1a2733; color:#e0e0e0; border:1px solid #2a3a4a; padding:7px 14px;
                border-radius:16px; width:220px; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#1a2733; border-radius:8px; overflow:hidden; }
  th { background:#0d1b2a; color:#4fc3f7; padding:10px; text-align:left; font-size:12px; }
  td { padding:9px 10px; border-bottom:1px solid #14202b; font-size:13px; }
  tr.row { cursor:pointer; } tr.row:hover { background:#1e3040; }
  .bullish{color:#4caf50;} .bearish{color:#f44336;} .neutral{color:#90a4ae;}
  .mini-bar { height:6px; border-radius:3px; margin-top:4px; display:flex; overflow:hidden; min-width:60px; }
  .mini-bar span{display:block;height:100%;}
  .mini-bar .bull{background:#4caf50;} .mini-bar .bear{background:#f44336;} .mini-bar .neu{background:#607d8b;}
  .panel { display:none; } .panel.open { display:block; }
  .detail { background:#1a2733; border-radius:8px; padding:16px; margin-top:14px; border:1px solid #2a3a4a; }
  .post { background:#0f1923; border-radius:6px; padding:10px 12px; margin:6px 0; font-size:13px;
          white-space:pre-wrap; word-break:break-word; border-left:3px solid #607d8b; }
  .post.bullish{border-left-color:#4caf50;} .post.bearish{border-left-color:#f44336;}
  .post .meta { color:#607d8b; font-size:11px; margin-top:6px; }
  .post .meta a { color:#4fc3f7; text-decoration:none; }
  .tag { display:inline-block; background:#253847; border-radius:10px; padding:1px 8px; font-size:11px; margin:1px 3px 1px 0; color:#81d4fa; }
  .heat-row { display:flex; align-items:center; gap:8px; margin:3px 0; font-size:12px; }
  .heat-cell { width:16px; height:16px; border-radius:3px; background:#182530; }
  .chart-wrap { background:#1a2733; border-radius:8px; padding:14px; }
  select { background:#1a2733; color:#e0e0e0; border:1px solid #2a3a4a; border-radius:8px; padding:6px; font-size:13px; }
  .badge-new { background:#ffb300; color:#0f1923; border-radius:8px; padding:0 6px; font-size:10px; font-weight:bold; }
  .empty { color:#607d8b; padding:24px; text-align:center; }
  #footer { color:#546e7a; font-size:11px; margin-top:24px; text-align:center; }
</style>
</head>
<body>
<h1>🔭 Serenity Watch</h1>
<p class="subtitle">追蹤 X 帳號 <a href="https://x.com/aleabitoreddit" style="color:#4fc3f7">@aleabitoreddit</a> 標的提及與立場 —
  <span id="updated"></span></p>

<div class="stats" id="stats"></div>

<div class="tabs">
  <button class="active" data-tab="overview" onclick="showTab('overview')">📊 總覽</button>
  <button data-tab="new" onclick="showTab('new')">🆕 今日新增 <span id="new-badge"></span></button>
  <button data-tab="trends" onclick="showTab('trends')">📈 趨勢</button>
  <button data-tab="feed" onclick="showTab('feed')">📝 貼文流</button>
</div>

<!-- 總覽 -->
<div class="panel open" id="panel-overview">
  <div class="toolbar">
    <button class="active" data-r="all" onclick="setRange('all',this)">全部(90天)</button>
    <button data-r="7" onclick="setRange('7',this)">7 天</button>
    <button data-r="30" onclick="setRange('30',this)">30 天</button>
    <input class="search-box" placeholder="搜尋代號或公司..." oninput="renderOverview()">
  </div>
  <table>
    <thead><tr><th>代號</th><th>公司</th><th>提及</th><th>多</th><th>空</th><th>中</th><th>分布</th></tr></thead>
    <tbody id="ov-body"></tbody>
  </table>
  <div id="detail" class="detail" style="display:none;">
    <h3 id="detail-title" style="color:#4fc3f7;margin-bottom:10px;"></h3>
    <div id="detail-content"></div>
  </div>
</div>

<!-- 今日新增 -->
<div class="panel" id="panel-new">
  <div id="new-content"></div>
</div>

<!-- 趨勢 -->
<div class="panel" id="panel-trends">
  <div class="toolbar">
    <span style="font-size:13px;color:#90a4ae;">標的：</span>
    <select id="trend-ticker" onchange="renderTrend()"></select>
  </div>
  <div class="chart-wrap"><canvas id="trend-canvas" width="1040" height="260" style="width:100%;"></canvas>
    <div id="trend-legend" style="font-size:12px;color:#90a4ae;margin-top:8px;"></div>
    <div style="font-size:12px;color:#607d8b;margin-top:6px;">怎麼看：每根柱子＝那一天 Serenity 提到這個標的的次數（柱高=次數）。柱子顏色組成：🟢看多話術 / 🔴看空話術 / ⚪中性。柱子變高變綠＝他最近更常提、更看好。</div>
  </div>
  <h4 style="margin:18px 0 8px;color:#4fc3f7;font-size:14px;">提及熱度（近 30 天 × 標的，顏色=提及次數）</h4>
  <div id="heat" style="overflow-x:auto;"></div>
</div>

<!-- 貼文流 -->
<div class="panel" id="panel-feed">
  <div class="toolbar">
    <button class="active" data-f="all" onclick="setFeedFilter('all',this)">全部立場</button>
    <button data-f="bullish" onclick="setFeedFilter('bullish',this)">🟢 看多</button>
    <button data-f="bearish" onclick="setFeedFilter('bearish',this)">🔴 看空</button>
    <input class="search-box" placeholder="關鍵字搜尋貼文..." oninput="renderFeed()">
  </div>
  <div id="feed-list"></div>
</div>

<div id="footer"></div>

<script>
let MENTIONS=[], STOCKS={}, DIFF=null, MANIFEST={};
let range='all', feedFilter='all';

async function boot(){
  try{
    const [m,d,man]=await Promise.all([
      fetch('data/all_mentions.json').then(r=>r.json()),
      fetch('daily_diff.json').then(r=>r.json()).catch(()=>null),
      fetch('manifest.json').then(r=>r.json()).catch(()=>({}))
    ]);
    MENTIONS=m.mentions||[]; STOCKS=m.stocks||{}; DIFF=d; MANIFEST=man;
    if(MANIFEST.last_updated) document.getElementById('updated').textContent=
      '最後更新 '+MANIFEST.last_updated.slice(0,16).replace('T',' ')+' UTC';
    // 資料新鮮度警告
    if(MANIFEST.latest_post_age_days!=null && MANIFEST.latest_post_age_days>5){
      document.body.insertAdjacentHTML('afterbegin',
        `<div style="background:#4a3500;border:1px solid #ffb300;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#ffe082;">⚠️ 注意：最新一則貼文已是 ${MANIFEST.latest_post_age_days} 天前（${(MANIFEST.latest_post_at||'').slice(0,10)}）。可能是他本人沒發文，或資料來源停止更新，并非系統壞掉。</div>`);
    }
    document.getElementById('footer').textContent=
      '資料來源：yan-labs 貼文庫 + BryanChanPokJyu scraper 備援合併 · 本儀表板每日自動更新 · 非投資建議';
    renderStats(); renderOverview(); renderNew(); setupTrends(); renderFeed();
  }catch(e){
    document.body.insertAdjacentHTML('beforeend','<div class="empty">載入資料失敗：'+e+'</div>');
  }
}

function inRange(m,days){
  if(days==='all')return true;
  const c=new Date(); c.setDate(c.getDate()-parseInt(days));
  return new Date(m.created_at)>=c;
}
function filtered(){ return MENTIONS.filter(m=>inRange(m,range)); }

function renderStats(){
  const ms=filtered();
  const b=ms.filter(m=>m.stance==='bullish').length, r=ms.filter(m=>m.stance==='bearish').length,
        n=ms.filter(m=>m.stance==='neutral').length;
  const t=new Set(ms.map(m=>m.ticker)).size;
  document.getElementById('stats').innerHTML=
    card(t,'涵蓋標的')+card(ms.length,'提及次數')+
    `<div class="stat-card"><div class="num bullish">${b}</div><div class="label">看多</div></div>`+
    `<div class="stat-card"><div class="num bearish">${r}</div><div class="label">看空</div></div>`+
    `<div class="stat-card"><div class="num neutral">${n}</div><div class="label">中立</div></div>`+
    (DIFF?card(DIFF.new_mention_count,'今日新增提及'):'');
}
function card(n,l){return `<div class="stat-card"><div class="num">${n}</div><div class="label">${l}</div></div>`;}

function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('open',p.id==='panel-'+t));
}
function setRange(r,btn){range=r;document.querySelectorAll('#panel-overview .toolbar button').forEach(b=>b.classList.toggle('active',b===btn));renderStats();renderOverview();}

function renderOverview(){
  const q=(document.querySelector('#panel-overview .search-box').value||'').toUpperCase();
  const agg={};
  filtered().forEach(m=>{
    const a=agg[m.ticker]||(agg[m.ticker]={ticker:m.ticker,company:m.company,total:0,bullish:0,bearish:0,neutral:0});
    a.total++; a[m.stance]++;
  });
  let rows=Object.values(agg).sort((x,y)=>y.total-x.total);
  if(q)rows=rows.filter(s=>s.ticker.includes(q)||s.company.toUpperCase().includes(q));
  document.getElementById('ov-body').innerHTML=rows.map(s=>{
    const bar=`<div class="mini-bar"><span class="bull" style="width:${s.bullish/s.total*100}%"></span><span class="bear" style="width:${s.bearish/s.total*100}%"></span><span class="neu" style="width:${s.neutral/s.total*100}%"></span></div>`;
    return `<tr class="row" onclick="showDetail('${s.ticker}')"><td class="bullish" style="font-weight:bold;">${s.ticker}</td><td>${s.company}</td><td>${s.total}</td><td class="bullish">${s.bullish}</td><td class="bearish">${s.bearish}</td><td class="neutral">${s.neutral}</td><td>${bar}</td></tr>`;
  }).join('')||'<tr><td colspan=7 class="empty">無資料</td></tr>';
}

function showDetail(t){
  const posts=MENTIONS.filter(m=>m.ticker===t).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const s=posts[0];
  document.getElementById('detail-title').textContent=`${t} — ${s?s.company:''}（${posts.length} 次提及）`;
  document.getElementById('detail-content').innerHTML=posts.map(postHtml).join('')||'<div class="empty">無</div>';
  document.getElementById('detail').style.display='block';
}

function postHtml(m){
  const d=(m.created_at||'').slice(0,10);
  const url=`https://x.com/aleabitoreddit/status/${m.post_id}`;
  return `<div class="post ${m.stance}"><span class="tag">$${m.ticker}</span><span class="${m.stance}">[${m.stance}]</span>\n${esc(m.text_preview)}…\n<div class="meta">${d} · ❤️${m.likes} 🔁${m.retweets} 👁${(m.views||0).toLocaleString()} · <a href="${url}" target="_blank">看原貼</a></div></div>`;
}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function renderNew(){
  const el=document.getElementById('new-content');
  const badge=document.getElementById('new-badge');
  if(!DIFF){el.innerHTML='<div class="empty">尚無每日 diffs（明日更新後出現）</div>';return;}
  badge.textContent=DIFF.new_mention_count>0?('('+DIFF.new_mention_count+')'):'';
  if(DIFF.new_mention_count===0){el.innerHTML=`<div class="empty">今日（${DIFF.date}）沒有新的標的提及</div>`;return;}
  el.innerHTML=`<p style="font-size:13px;color:#90a4ae;margin-bottom:10px;">${DIFF.date} 新增 ${DIFF.new_mention_count} 筆提及（對比昨日快照）</p>`+
    '<table><thead><tr><th>代號</th><th>公司</th><th>新增</th><th>多</th><th>空</th></tr></thead><tbody>'+
    DIFF.by_ticker.map(t=>`<tr class="row" onclick="showTab('overview');showDetail('${t.ticker}')"><td class="bullish" style="font-weight:bold;">${t.ticker}</td><td>${t.company}</td><td><span class="badge-new">+${t.new}</span></td><td class="bullish">${t.bullish}</td><td class="bearish">${t.bearish}</td></tr>`).join('')+
    '</tbody></table>';
}

function setupTrends(){
  const sel=document.getElementById('trend-ticker');
  const ts=Object.keys(STOCKS).sort((a,b)=>STOCKS[b].total_mentions-STOCKS[a].total_mentions);
  sel.innerHTML=ts.map(t=>`<option value="${t}">${t} (${STOCKS[t].total_mentions})</option>`).join('');
  renderTrend(); renderHeat();
}
function renderTrend(){
  const t=document.getElementById('trend-ticker').value; if(!t)return;
  const days=60, buckets=[...Array(days)].map((_,i)=>({b:null,n:0,bull:0,bear:0}));
  const today=new Date(); today.setHours(0,0,0,0);
  MENTIONS.filter(m=>m.ticker===t).forEach(m=>{
    const d=new Date(m.created_at); d.setHours(0,0,0,0);
    const idx=days-1-Math.round((today-d)/86400000);
    if(idx>=0&&idx<days){buckets[idx].n++; if(m.stance==='bullish')buckets[idx].bull++; if(m.stance==='bearish')buckets[idx].bear++;}
  });
  drawBars(buckets);
  document.getElementById('trend-legend').textContent=
    `${t} 近 ${days} 天每日提及數（綠=看多、紅=看空）。橫軸：${days}天前 → 今天`;
}
function drawBars(buckets){
  const cv=document.getElementById('trend-canvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const max=Math.max(1,...buckets.map(b=>b.n)), bw=cv.width/buckets.length;
  buckets.forEach((b,i)=>{
    const x=i*bw, base=cv.height-20;
    if(b.n){const h=b.n/max*(cv.height-40);
      ctx.fillStyle='#4caf50';ctx.fillRect(x+1,base-h,bw-2,h*b.bull/b.n);
      ctx.fillStyle='#f44336';ctx.fillRect(x+1,base-h*b.bull/b.n,bw-2,h*b.bear/b.n);
      ctx.fillStyle='#607d8b';ctx.fillRect(x+1,base-h*(b.bull+b.bear)/b.n,bw-2,h*(b.n-b.bull-b.bear)/b.n);}
  });
  ctx.fillStyle='#546e7a';ctx.font='10px sans-serif';
  ctx.fillText('-60d',4,cv.height-6); ctx.fillText('today',cv.width-34,cv.height-6);
}
function renderHeat(){
  const days=30, today=new Date(); today.setHours(0,0,0,0);
  const byTicker={};
  MENTIONS.forEach(m=>{
    const d=new Date(m.created_at); d.setHours(0,0,0,0);
    const idx=days-1-Math.round((today-d)/86400000);
    if(idx>=0&&idx<days){(byTicker[m.ticker]=byTicker[m.ticker]||Array(days).fill(0))[idx]++;}
  });
  const rows=Object.entries(byTicker).sort((a,b)=>b[1].reduce((s,x)=>s+x,0)-a[1].reduce((s,x)=>s+x,0)).slice(0,20);
  document.getElementById('heat').innerHTML=rows.map(([t,arr])=>{
    const mx=Math.max(...arr,1);
    return `<div class="heat-row"><span style="width:60px;color:#81d4fa;font-weight:bold;">${t}</span>`+
      arr.map(v=>`<div class="heat-cell" title="${v} 次" style="background:${v?`rgba(79,195,247,${0.15+0.85*v/mx})`:'#182530'}"></div>`).join('')+'</div>';
  }).join('');
}

function setFeedFilter(f,btn){feedFilter=f;document.querySelectorAll('#panel-feed .toolbar button').forEach(b=>b.classList.toggle('active',b===btn));renderFeed();}
function renderFeed(){
  const q=(document.querySelector('#panel-feed .search-box').value||'').toUpperCase();
  const seen=new Set();
  let ms=MENTIONS.filter(m=>{
    if(seen.has(m.post_id))return false;
    return true;
  });
  // dedupe by post, keep the mention whose stance is most decisive
  const best={};
  MENTIONS.forEach(m=>{ if(!best[m.post_id]||m.stance!=='neutral')best[m.post_id]=m; });
  ms=Object.values(best);
  if(feedFilter!=='all'){
    // a post qualifies if ANY mention of it has that stance
    const ids=new Set(MENTIONS.filter(m=>m.stance===feedFilter).map(m=>m.post_id));
    ms=ms.filter(m=>ids.has(m.post_id));
  }
  if(q)ms=ms.filter(m=>m.text_preview.toUpperCase().includes(q));
  ms.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  document.getElementById('feed-list').innerHTML=ms.slice(0,100).map(postHtml).join('')||'<div class="empty">無符合的貼文</div>';
}
boot();
</script>
</body>
</html>
